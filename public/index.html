<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etsy Product Creation Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 15px;
        }

        .poster-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .poster-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .poster-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .poster-item h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .poster-item p {
            color: #666;
            font-size: 0.9em;
        }

        .poster-content {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .download-btn {
            background: #28a745;
            margin-top: 15px;
        }

        .download-btn:hover {
            background: #218838;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Etsy Product Creation Tool</h1>
            <p class="subtitle">Generate stunning digital posters with AI</p>
        </header>

        <div class="main-content">
            <div class="card">
                <h2>Generate New Poster</h2>
                <div class="form-group">
                    <label for="posterPrompt">Describe your poster idea:</label>
                    <textarea
                        id="posterPrompt"
                        placeholder="Example: A minimalist motivational poster with the quote 'Believe in yourself' featuring mountain scenery and warm sunset colors"
                    ></textarea>
                </div>
                <button id="generateBtn" onclick="generatePoster()">Generate Poster</button>
                <div id="generatingStatus" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    Generating your poster...
                </div>
            </div>

            <div class="card">
                <h2>Your Posters</h2>
                <div id="postersList" class="poster-list">
                    <div class="empty-state">No posters yet. Generate your first one!</div>
                </div>
            </div>
        </div>

        <div class="card" id="posterDetail" style="display: none;">
            <h2>Poster Details</h2>
            <div id="posterInfo"></div>
            <div id="posterContentDisplay" class="poster-content"></div>
            <button class="download-btn" onclick="downloadPoster()">Download as Text</button>
        </div>
    </div>

    <script>
        let currentPoster = null;

        async function generatePoster() {
            const prompt = document.getElementById('posterPrompt').value.trim();

            if (!prompt) {
                alert('Please enter a prompt for your poster');
                return;
            }

            const generateBtn = document.getElementById('generateBtn');
            const status = document.getElementById('generatingStatus');

            generateBtn.disabled = true;
            status.style.display = 'block';

            try {
                const response = await fetch('/api/posters', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt }),
                });

                if (!response.ok) {
                    throw new Error('Failed to generate poster');
                }

                const poster = await response.json();
                document.getElementById('posterPrompt').value = '';
                await loadPosters();
                viewPoster(poster);
            } catch (error) {
                alert('Error generating poster: ' + error.message);
            } finally {
                generateBtn.disabled = false;
                status.style.display = 'none';
            }
        }

        async function loadPosters() {
            try {
                const response = await fetch('/api/posters');
                const posters = await response.json();

                const postersList = document.getElementById('postersList');

                if (posters.length === 0) {
                    postersList.innerHTML = '<div class="empty-state">No posters yet. Generate your first one!</div>';
                    return;
                }

                postersList.innerHTML = posters
                    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                    .map(poster => `
                        <div class="poster-item" onclick='viewPoster(${JSON.stringify(poster)})'>
                            <h3>${poster.prompt.substring(0, 50)}${poster.prompt.length > 50 ? '...' : ''}</h3>
                            <p>Created: ${new Date(poster.createdAt).toLocaleString()}</p>
                        </div>
                    `).join('');
            } catch (error) {
                console.error('Error loading posters:', error);
            }
        }

        function viewPoster(poster) {
            currentPoster = poster;
            const detailSection = document.getElementById('posterDetail');
            const posterInfo = document.getElementById('posterInfo');
            const posterContent = document.getElementById('posterContentDisplay');

            posterInfo.innerHTML = `
                <h3>${poster.prompt}</h3>
                <p>Created: ${new Date(poster.createdAt).toLocaleString()}</p>
                <p>ID: ${poster.id}</p>
            `;

            posterContent.textContent = poster.imageData;
            detailSection.style.display = 'block';
            detailSection.scrollIntoView({ behavior: 'smooth' });
        }

        function downloadPoster() {
            if (!currentPoster) return;

            const blob = new Blob([currentPoster.imageData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `poster-${currentPoster.id}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Load posters on page load
        loadPosters();
    </script>
</body>
</html>
